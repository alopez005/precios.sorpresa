         </table>
        </div>
        <div class="btn-bar"><button class="btn-primary" onclick="descargarTiendaNube(true)">⬇ Descargar CSV Tienda Nube</button></div>
      </div>

      <div class="btn-bar" style="margin-top:24px">
        <button class="btn-secondary" onclick="goStep(1)">← Volver al inicio</button>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="diagModal">
    <div class="modal">
      <h3>🔍 Diagnóstico de Códigos</h3>
      <p style="color:var(--text2);font-size:13px;margin-bottom:16px">Muestra cómo el sistema lee los códigos de cada archivo para detectar problemas de matching.</p>
      <pre id="diagContent"></pre>
      <div class="btn-bar"><button class="btn-secondary" onclick="document.getElementById('diagModal').classList.remove('visible')">Cerrar</button></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
